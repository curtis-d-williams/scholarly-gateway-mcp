[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarly-gateway-mcp"
version = "0.1.0"
description = "A deterministic, reusable MCP substrate for scholarly publication retrieval."
authors = [{ name = "Curtis" }]
requires-python = ">=3.10"

dependencies = [
    "fastmcp",
    "httpx",
    "pydantic>=2.0",
]

[project.scripts]
scholarly-gateway = "scholarly_gateway.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
